name: Server check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Run canonical server gate
        run: mise run ci:server:check

  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Test the shared Swift package
        run: mise run ios:test
      - name: Build the Apple app targets
        run: mise run ios:build

version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: ../../internal/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: ../../internal/gen
    opt:
      - paths=source_relative
  - remote: buf.build/apple/swift:v1.38.1
    out: ../../clients/ios/UnetonPackage/Sources/UnetonAPI/Generated
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: ../../clients/ios/UnetonPackage/Sources/UnetonAPI/Generated
    opt:
      - Visibility=Public
      - GenerateAsyncMethods=true

name: uneton

# Rotate container logs so a chatty service cannot fill the host disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  # A new named volume is root-owned; the API and Litestream run as UID 10001.
  data-init:
    image: alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /data /backup"]
    volumes:
      - uneton-data:/data
      - uneton-backups:/backup
    logging: *logging

  api:
    image: ${COMPOSE_BACKEND_IMAGE:?set COMPOSE_BACKEND_IMAGE to a backend image digest}
    restart: unless-stopped
    stop_grace_period: 40s
    user: "10001:10001"
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Each service receives only its own values from the root-only `.env`; the API
    # never sees backup credentials and Litestream never sees signing keys.
    environment:
      # Leave headroom under mem_limit so the Go GC works harder before the kernel OOM-kills.
      GOMEMLIMIT: 400MiB
      UNETON_RUNTIME_ENVIRONMENT: ${UNETON_RUNTIME_ENVIRONMENT:-production}
      UNETON_LOG_LEVEL: ${UNETON_LOG_LEVEL:-info}
      UNETON_AUTH_TOKEN_SECRET: ${UNETON_AUTH_TOKEN_SECRET:?set UNETON_AUTH_TOKEN_SECRET}
      UNETON_LEGAL_OPERATOR_NAME: ${UNETON_LEGAL_OPERATOR_NAME:?set UNETON_LEGAL_OPERATOR_NAME}
      UNETON_LEGAL_CONTACT_EMAIL: ${UNETON_LEGAL_CONTACT_EMAIL:?set UNETON_LEGAL_CONTACT_EMAIL}
      UNETON_AUTH_APPLE_CLIENT_ID: ${UNETON_AUTH_APPLE_CLIENT_ID:-solutions.bytesized.uneton}
      UNETON_AUTH_APPLE_SERVER_NOTIFICATION_URL: ${UNETON_AUTH_APPLE_SERVER_NOTIFICATION_URL:?set UNETON_AUTH_APPLE_SERVER_NOTIFICATION_URL}
      UNETON_AUTH_APPLE_TOKEN_ENCRYPTION_ACTIVE_KEY_ID: ${UNETON_AUTH_APPLE_TOKEN_ENCRYPTION_ACTIVE_KEY_ID:?set UNETON_AUTH_APPLE_TOKEN_ENCRYPTION_ACTIVE_KEY_ID}
      UNETON_AUTH_APPLE_TOKEN_ENCRYPTION_KEYRING_JSON: ${UNETON_AUTH_APPLE_TOKEN_ENCRYPTION_KEYRING_JSON:?set UNETON_AUTH_APPLE_TOKEN_ENCRYPTION_KEYRING_JSON}
      UNETON_INTEGRATION_APPLE_TEAM_ID: ${UNETON_INTEGRATION_APPLE_TEAM_ID:?set UNETON_INTEGRATION_APPLE_TEAM_ID}
      UNETON_INTEGRATION_APPLE_PRIVATE_KEY_ID: ${UNETON_INTEGRATION_APPLE_PRIVATE_KEY_ID:?set UNETON_INTEGRATION_APPLE_PRIVATE_KEY_ID}
      UNETON_INTEGRATION_APPLE_PRIVATE_KEY_PEM: ${UNETON_INTEGRATION_APPLE_PRIVATE_KEY_PEM:?set UNETON_INTEGRATION_APPLE_PRIVATE_KEY_PEM}
      # All four empty reuses the Apple integration key for APNs; set all four or none.
      UNETON_INTEGRATION_APNS_TEAM_ID: ${UNETON_INTEGRATION_APNS_TEAM_ID:-}
      UNETON_INTEGRATION_APNS_PRIVATE_KEY_ID: ${UNETON_INTEGRATION_APNS_PRIVATE_KEY_ID:-}
      UNETON_INTEGRATION_APNS_PRIVATE_KEY_PEM: ${UNETON_INTEGRATION_APNS_PRIVATE_KEY_PEM:-}
      UNETON_INTEGRATION_APNS_TOPIC: ${UNETON_INTEGRATION_APNS_TOPIC:-}
    volumes:
      - uneton-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uneton", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
    logging: *logging

  caddy:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      CADDY_PUBLIC_HOST: ${CADDY_PUBLIC_HOST:?set CADDY_PUBLIC_HOST}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  litestream:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["replicate"]
    user: "10001:10001"
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:?set LITESTREAM_REPLICA_URL to an off-host replica}
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${UNETON_BACKUP_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${UNETON_BACKUP_SECRET_ACCESS_KEY:-}
    volumes:
      - uneton-data:/data
      - uneton-backups:/backup
      - ./litestream/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  uneton-data:
  uneton-backups:
  caddy-data:
  caddy-config:

name: uneton

services:
  api:
    image: ${COMPOSE_BACKEND_IMAGE:-uneton-backend:latest}
    restart: unless-stopped
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file: .env
    volumes:
      - uneton-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - uneton-data:/data
      - uneton-backups:/backup
      - ./litestream/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  uneton-data:
  uneton-backups:
  caddy-data:
  caddy-config:
